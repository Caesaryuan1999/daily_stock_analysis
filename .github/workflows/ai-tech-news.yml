name: AI 技术情报日报

on:
  schedule:
    # GitHub cron is UTC. The two entries plus the local-time gate keep the
    # effective run time at 08:05 America/Los_Angeles across DST changes.
    - cron: "5 15 * * *"
    - cron: "5 16 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: 报告模式
        required: true
        default: daily
        type: choice
        options:
          - daily
          - weekly
      lookback_hours:
        description: 自定义回溯小时数；留空使用模式默认值
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ai-tech-news-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: America/Los_Angeles
  PYTHONPATH: src

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check local schedule window
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          local_hour="$(TZ=America/Los_Angeles date +%H)"
          if [[ "$local_hour" == "08" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping duplicate UTC trigger; local hour is ${local_hour}."
          fi

      - name: Check out repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: python -m pip install --upgrade pip && python -m pip install "openai>=1.68.0"

      - name: Run AI news unit tests
        if: steps.gate.outputs.run == 'true'
        run: python -m unittest discover -s tests/ai_tech_news -v

      - name: Validate OpenAI secret
        if: steps.gate.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo "::error::Repository secret OPENAI_API_KEY is not configured."
            exit 1
          fi

      - name: Generate cited report
        if: steps.gate.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPORT_MODE: ${{ github.event.inputs.mode || 'daily' }}
          LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours || '' }}
          AI_TECH_NEWS_MODEL: ${{ vars.AI_TECH_NEWS_MODEL || 'gpt-5.5' }}
          AI_TECH_NEWS_REASONING_EFFORT: ${{ vars.AI_TECH_NEWS_REASONING_EFFORT || 'medium' }}
          AI_TECH_NEWS_LANGUAGE: ${{ vars.AI_TECH_NEWS_LANGUAGE || 'zh-CN' }}
          AI_TECH_NEWS_TIMEZONE: America/Los_Angeles
        shell: bash
        run: |
          set -euo pipefail
          args=(--mode "$REPORT_MODE")
          if [[ -n "$LOOKBACK_HOURS" ]]; then
            args+=(--lookback-hours "$LOOKBACK_HOURS")
          fi
          python -m ai_tech_news "${args[@]}"

      - name: Add report to workflow summary
        if: steps.gate.outputs.run == 'true'
        run: cat reports/ai-tech-news/latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit report
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ai-tech-news
          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi
          git commit -m "chore(ai-news): publish $(TZ=America/Los_Angeles date +%F) report"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
